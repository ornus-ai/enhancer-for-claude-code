# The maintenance robot (PLAN.md §3): every 6 hours, each new Claude Code release on
# Open VSX is applied, re-applied and restored on a real Windows and a real macOS runner.
# The compatibility table in compat/ is committed; a break opens (or updates) one issue.
name: Compatibility robot

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Check this Claude Code version again (empty: the newest unchecked ones)'
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: compatibility-robot
  cancel-in-progress: false

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check new Claude Code releases
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -o pipefail
          if [ -n "$VERSION" ]; then
            node out/robot/robot.js check --version "$VERSION" 2>&1 | tee robot-log.txt
          else
            node out/robot/robot.js check --latest 3 2>&1 | tee robot-log.txt
          fi
          # Hand on only this runner's own table: the checkout's copies of the other
          # platforms are stale and would overwrite that runner's fresh results.
          mkdir -p robot-out
          own="compat/$(node -p 'process.platform + "-" + process.arch').json"
          if [ -f "$own" ]; then cp "$own" robot-out/; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-${{ matrix.os }}
          path: |
            robot-out/*.json
            robot-log.txt
          if-no-files-found: ignore

  publish:
    needs: check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Update the compatibility table
        shell: bash
        run: |
          mkdir -p compat
          for dir in artifacts/compat-*; do
            [ -d "$dir" ] && cp "$dir"/robot-out/*.json compat/ 2>/dev/null || true
          done
          node out/robot/robot.js table
          git config user.name 'enhancer-robot'
          git config user.email 'enhancer-robot@users.noreply.github.com'
          git add compat
          if ! git diff --cached --quiet; then
            git commit -m 'Update the Claude Code compatibility table'
            git push
          fi
      - name: Open or update the robot issue
        if: needs.check.result != 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Compatibility robot: a Claude Code release needs work'
          {
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            for log in artifacts/compat-*/robot-log.txt; do
              [ -f "$log" ] || continue
              echo "### $(basename "$(dirname "$log")")"
              echo '```'
              cat "$log"
              echo '```'
            done
          } > issue.md
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file issue.md
          else
            gh issue create --title "$title" --body-file issue.md
          fi
